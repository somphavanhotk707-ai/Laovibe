<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaoVibe by Somphavanh — AI Laos Event Scraper & Personality Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #faf7f2;
      font-family: ui-sans-serif, system-ui, "Noto Sans Lao", sans-serif;
    }
    .chip-active { background-color: #0f766e; color: white; border-color: #0f766e; }
  </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col">

  <!-- Top Navbar -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-teal-700 text-amber-300 flex items-center justify-center font-bold shadow-sm">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-lg leading-tight text-stone-900">LaoVibe AI</h1>
            <span class="text-[11px] font-semibold bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full border border-amber-200" data-i18n="byBadge">
              by Somphavanh
            </span>
          </div>
          <p class="text-xs text-stone-500" data-i18n="subtitle">Laos Event Scraper & Personality Concierge</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <!-- Language Toggle -->
        <div class="flex bg-stone-100 p-0.5 rounded-xl border border-stone-200">
          <button id="langBtnEn" onclick="setLanguage('en')" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-teal-800 shadow-sm">EN</button>
          <button id="langBtnLo" onclick="setLanguage('lo')" class="px-2.5 py-1 rounded-lg text-xs font-semibold text-stone-600 hover:text-stone-900">ລາວ</button>
        </div>

        <span id="cacheStatus" class="text-xs bg-stone-100 text-stone-600 px-3 py-1.5 rounded-full border border-stone-200">
          Loading events...
        </span>

        <label class="flex items-center gap-1.5 text-xs text-stone-600 cursor-pointer select-none">
          <input id="includeSearchToggle" type="checkbox" class="rounded text-teal-700 focus:ring-teal-600" />
          <span data-i18n="liveSearchScrape">Use Gemini Live Search</span>
        </label>

        <button id="scrapeBtn" onclick="scrapeEvents()"
          class="bg-teal-700 hover:bg-teal-800 text-white text-sm font-medium px-4 py-2 rounded-xl flex items-center gap-2 shadow-sm transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          <span data-i18n="scrapeBtn">Scrape Laos Events</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Error / Info Banner -->
  <div id="alertBanner" class="hidden max-w-7xl mx-auto w-full px-4 mt-4">
    <div id="alertContent" class="p-3 rounded-xl text-sm border"></div>
  </div>

  <!-- Main Workspace -->
  <main class="max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">

    <!-- Left Sidebar: Personality Profiler -->
    <aside class="lg:col-span-4 space-y-5">
      <div class="bg-white rounded-2xl border border-stone-200 p-5 shadow-sm space-y-5">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-base flex items-center gap-2 text-stone-900">
            <i data-lucide="user-check" class="w-4 h-4 text-teal-700"></i>
            <span data-i18n="profileTitle">Your Personality Profile</span>
          </h2>
          <span class="text-[11px] text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full font-medium" data-i18n="autoSaved">Auto-saved</span>
        </div>

        <!-- Social Energy -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2" data-i18n="socialEnergyLabel">Social Energy</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectSingle('energy', 'Introvert', this)" class="energy-btn border border-stone-200 rounded-xl py-2 px-1 text-xs font-medium hover:bg-stone-50" data-i18n="introvert">Introvert</button>
            <button type="button" onclick="selectSingle('energy', 'Ambivert', this)" class="energy-btn chip-active border border-stone-200 rounded-xl py-2 px-1 text-xs font-medium" data-i18n="ambivert">Ambivert</button>
            <button type="button" onclick="selectSingle('energy', 'Extrovert', this)" class="energy-btn border border-stone-200 rounded-xl py-2 px-1 text-xs font-medium hover:bg-stone-50" data-i18n="extrovert">Extrovert</button>
          </div>
        </div>

        <!-- Pace -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2" data-i18n="paceLabel">Ideal Event Pace</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectSingle('pace', 'Slow & Mindful', this)" class="pace-btn border border-stone-200 rounded-xl py-2 px-1 text-xs font-medium hover:bg-stone-50" data-i18n="paceSlow">Slow & Mindful</button>
            <button type="button" onclick="selectSingle('pace', 'Balanced', this)" class="pace-btn chip-active border border-stone-200 rounded-xl py-2 px-1 text-xs font-medium" data-i18n="paceBalanced">Balanced</button>
            <button type="button" onclick="selectSingle('pace', 'High Energy', this)" class="pace-btn border border-stone-200 rounded-xl py-2 px-1 text-xs font-medium hover:bg-stone-50" data-i18n="paceHigh">High Energy</button>
          </div>
        </div>

        <!-- City & Budget -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1.5" data-i18n="cityLabel">City in Laos</label>
            <select id="citySelect" class="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-teal-600">
              <option value="Anywhere in Laos" data-i18n="cityAny">Anywhere in Laos</option>
              <option value="Vientiane" data-i18n="cityVte">Vientiane</option>
              <option value="Luang Prabang" data-i18n="cityLpb">Luang Prabang</option>
              <option value="Vang Vieng" data-i18n="cityVv">Vang Vieng</option>
              <option value="Pakse" data-i18n="cityPakse">Pakse</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1.5" data-i18n="budgetLabel">Budget</label>
            <select id="budgetSelect" class="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-teal-600">
              <option value="Any" data-i18n="budgetAny">Any</option>
              <option value="Free / Budget" data-i18n="budgetFree">Free / Budget</option>
              <option value="Moderate" data-i18n="budgetMod">Moderate</option>
            </select>
          </div>
        </div>

        <!-- Interests -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2" data-i18n="interestsLabel">Interests & Vibes</label>
          <div class="flex flex-wrap gap-1.5" id="interestChips">
            <button type="button" data-key="Arts & Culture" onclick="toggleInterest(this)" class="interest-btn chip-active border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intArts">Arts & Culture</button>
            <button type="button" data-key="Food & Coffee" onclick="toggleInterest(this)" class="interest-btn chip-active border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intFood">Food & Coffee</button>
            <button type="button" data-key="Live Music" onclick="toggleInterest(this)" class="interest-btn border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intMusic">Live Music</button>
            <button type="button" data-key="Markets & Crafts" onclick="toggleInterest(this)" class="interest-btn border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intMarkets">Markets & Crafts</button>
            <button type="button" data-key="Nature & Wellness" onclick="toggleInterest(this)" class="interest-btn border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intNature">Nature & Wellness</button>
            <button type="button" data-key="Tech & Networking" onclick="toggleInterest(this)" class="interest-btn border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intTech">Tech & Networking</button>
            <button type="button" data-key="Festivals & Temples" onclick="toggleInterest(this)" class="interest-btn border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intFest">Festivals & Temples</button>
            <button type="button" data-key="Nightlife & Social" onclick="toggleInterest(this)" class="interest-btn border border-stone-200 rounded-full px-3 py-1 text-xs" data-i18n="intNight">Nightlife & Social</button>
          </div>
        </div>

        <!-- Bio -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1.5" data-i18n="bioLabel">About You / Current Mood</label>
          <textarea id="bioInput" rows="3"
            data-i18n-placeholder="bioPlaceholder"
            placeholder="e.g., I'm a solo traveler who loves quiet heritage spaces, acoustic music, and local markets—not loud clubs."
            class="w-full border border-stone-200 rounded-xl p-3 text-sm focus:outline-teal-600"></textarea>
        </div>

        <!-- Custom Scrape URL -->
        <div class="pt-3 border-t border-stone-100">
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1.5" data-i18n="customUrlLabel">Add Custom Laos Event URL (Optional)</label>
          <input id="customUrlInput" type="url" placeholder="https://example.com/laos-events"
            class="w-full border border-stone-200 rounded-xl px-3 py-2 text-xs focus:outline-teal-600" />
        </div>
      </div>
    </aside>

    <!-- Right Main Panel -->
    <section class="lg:col-span-8 flex flex-col gap-5">

      <!-- Tabs -->
      <div class="flex gap-2 bg-white p-1.5 rounded-2xl border border-stone-200 w-fit">
        <button id="tabConcierge" onclick="switchTab('concierge')"
          class="px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 text-white transition" data-i18n="tabMatcher">
          AI Personality Matcher
        </button>
        <button id="tabExplore" onclick="switchTab('explore')"
          class="px-4 py-2 rounded-xl text-sm font-semibold text-stone-600 hover:bg-stone-100 transition">
          <span data-i18n="tabExplore">All Scraped Events</span> (<span id="eventCountTab">0</span>)
        </button>
      </div>

      <!-- TAB 1: AI Concierge -->
      <div id="panelConcierge" class="space-y-5">
        <div class="bg-white rounded-2xl border border-stone-200 p-5 shadow-sm space-y-4">
          <h2 class="font-bold text-base text-stone-900" data-i18n="askTitle">Ask about events in Laos</h2>

          <!-- Quick Prompts -->
          <div class="flex flex-wrap gap-2">
            <button onclick="askPresetKey('prompt1')"
              class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 px-3 py-1.5 rounded-full transition" data-i18n="prompt1">
              What fits my vibe this week?
            </button>
            <button onclick="askPresetKey('prompt2')"
              class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 px-3 py-1.5 rounded-full transition" data-i18n="prompt2">
              Calm cultural & creative events
            </button>
            <button onclick="askPresetKey('prompt3')"
              class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 px-3 py-1.5 rounded-full transition" data-i18n="prompt3">
              Social & live music spots
            </button>
          </div>

          <!-- Input Form -->
          <form onsubmit="handleAsk(event)" class="flex flex-col sm:flex-row gap-2.5">
            <input id="queryInput" type="text" required
              data-i18n-placeholder="queryPlaceholder"
              placeholder="Ask anything... e.g. 'Any weekend art, food, or music events in Vientiane?'"
              class="flex-1 border border-stone-300 rounded-xl px-4 py-2.5 text-sm focus:outline-teal-600" />
            <button id="askBtn" type="submit"
              class="bg-stone-900 hover:bg-stone-800 text-white text-sm font-medium px-5 py-2.5 rounded-xl flex items-center justify-center gap-2 transition">
              <i data-lucide="send" class="w-4 h-4"></i>
              <span data-i18n="matchBtn">Match Me</span>
            </button>
          </form>

          <label class="flex items-center gap-2 text-xs text-stone-500 cursor-pointer">
            <input id="liveQuerySearch" type="checkbox" class="rounded text-teal-700" />
            <span data-i18n="liveQueryLabel">Also run a fresh Gemini Google Search for this specific question</span>
          </label>
        </div>

        <!-- Recommendation Output -->
        <div id="recommendResults" class="space-y-4"></div>
      </div>

      <!-- TAB 2: Scraped Event Explorer -->
      <div id="panelExplore" class="hidden space-y-4">
        <div class="bg-white rounded-2xl border border-stone-200 p-4 flex flex-wrap gap-3 items-center justify-between">
          <input id="exploreFilterInput" oninput="renderAllEvents()" type="text"
            data-i18n-placeholder="filterPlaceholder"
            placeholder="Filter by title, city, or vibe..."
            class="border border-stone-200 rounded-xl px-3.5 py-2 text-sm flex-1 min-w-[200px] focus:outline-teal-600" />
          <select id="exploreCityFilter" onchange="renderAllEvents()" class="border border-stone-200 rounded-xl px-3 py-2 text-sm bg-white">
            <option value="" data-i18n="filterAllCities">All Cities</option>
            <option value="Vientiane" data-i18n="cityVte">Vientiane</option>
            <option value="Luang Prabang" data-i18n="cityLpb">Luang Prabang</option>
            <option value="Vang Vieng" data-i18n="cityVv">Vang Vieng</option>
            <option value="Pakse" data-i18n="cityPakse">Pakse</option>
          </select>
        </div>
        <div id="allEventsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

    </section>
  </main>

  <!-- Footer Credential -->
  <footer class="bg-white border-t border-stone-200 py-4 px-4 mt-8">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs text-stone-500">
      <span data-i18n="footerCredit">LaoVibe AI • Created &amp; Curated by <strong class="text-stone-800">Somphavanh</strong></span>
      <span>Powered by Gemini &amp; FastAPI</span>
    </div>
  </footer>

    };

    let state = {
      lang: "en",
      energy: "Ambivert",
      pace: "Balanced",
      interests: ["Arts & Culture", "Food & Coffee"],
      events: [],
      updatedAt: null,
      lastRecData: null,
    };

    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
    }

    function setLanguage(lang) {
      state.lang = lang;
      document.documentElement.lang = lang === "lo" ? "lo" : "en";

      document.getElementById("langBtnEn").className = lang === "en"
        ? "px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-teal-800 shadow-sm"
        : "px-2.5 py-1 rounded-lg text-xs font-semibold text-stone-600 hover:text-stone-900";
      document.getElementById("langBtnLo").className = lang === "lo"
        ? "px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-teal-800 shadow-sm"
        : "px-2.5 py-1 rounded-lg text-xs font-semibold text-stone-600 hover:text-stone-900";

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (I18N[lang][key]) el.textContent = I18N[lang][key];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        if (I18N[lang][key]) el.placeholder = I18N[lang][key];
      });

      updateCacheStatusText();
      renderAllEvents();
      if (state.lastRecData) renderRecommendations(state.lastRecData);
    }

    function showAlert(msg, type = "info") {
      const banner = document.getElementById("alertBanner");
      const content = document.getElementById("alertContent");
      banner.classList.remove("hidden");
      content.className = type === "error"
        ? "p-3 rounded-xl text-sm border bg-red-50 border-red-200 text-red-800"
        : "p-3 rounded-xl text-sm border bg-teal-50 border-teal-200 text-teal-900";
      content.textContent = msg;
    }

    function hideAlert() {
      document.getElementById("alertBanner").classList.add("hidden");
    }

    function selectSingle(group, value, btn) {
      state[group] = value;
      document.querySelectorAll(`.${group}-btn`).forEach(b => b.classList.remove("chip-active"));
      btn.classList.add("chip-active");
    }

    function toggleInterest(btn) {
      const val = btn.getAttribute("data-key");
      btn.classList.toggle("chip-active");
      if (state.interests.includes(val)) {
        state.interests = state.interests.filter(i => i !== val);
      } else {
        state.interests.push(val);
      }
    }

    function getPersonalityPayload() {
      return {
        social_energy: state.energy,
        pace: state.pace,
        interests: state.interests,
        budget: document.getElementById("budgetSelect").value,
        preferred_city: document.getElementById("citySelect").value,
        bio: document.getElementById("bioInput").value.trim(),
      };
    }

    function switchTab(tab) {
      const isConcierge = tab === "concierge";
      document.getElementById("panelConcierge").classList.toggle("hidden", !isConcierge);
      document.getElementById("panelExplore").classList.toggle("hidden", isConcierge);

      document.getElementById("tabConcierge").className = isConcierge
        ? "px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 text-white transition"
        : "px-4 py-2 rounded-xl text-sm font-semibold text-stone-600 hover:bg-stone-100 transition";
      document.getElementById("tabExplore").className = !isConcierge
        ? "px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 text-white transition"
        : "px-4 py-2 rounded-xl text-sm font-semibold text-stone-600 hover:bg-stone-100 transition";
    }

    function updateCacheStatusText() {
      const statusEl = document.getElementById("cacheStatus");
      if (state.events.length === 0) {
        statusEl.textContent = t("emptyCache");
      } else if (state.lang === "lo") {
        statusEl.textContent = `${state.events.length} ກິດຈະກຳ • ອັບເດດ ${state.updatedAt || "ຫຼ້າສຸດ"}`;
      } else {
        statusEl.textContent = `${state.events.length} events • Updated ${state.updatedAt || "recently"}`;
      }
    }

    async function loadCachedEvents() {
      try {
        const res = await fetch("/api/events");
        const data = await res.json();
        updateEventUI(data);
      } catch (e) {
        document.getElementById("cacheStatus").textContent = "Failed to load cache";
      }
    }

    function updateEventUI(data) {
      state.events = data.events || [];
      state.updatedAt = data.updated_at || null;
      document.getElementById("eventCountTab").textContent = state.events.length;
      updateCacheStatusText();
      renderAllEvents();
    }

    async function scrapeEvents() {
      hideAlert();
      const btn = document.getElementById("scrapeBtn");
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span><span>${escapeHtml(t("scrapingBtn"))}</span>`;

      const customUrl = document.getElementById("customUrlInput").value.trim();
      const useSearch = document.getElementById("includeSearchToggle").checked;
      const cityFocus = document.getElementById("citySelect").value;

      try {
        const res = await fetch("/api/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            custom_urls: customUrl ? [customUrl] : [],
            use_google_search: useSearch,
            city_focus: cityFocus === "Anywhere in Laos" ? "All of Laos" : cityFocus,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Scraping failed");
        updateEventUI(data);
        showAlert(t("scrapeSuccess").replace("{n}", data.events.length));
      } catch (err) {
        showAlert(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="refresh-cw" class="w-4 h-4"></i><span data-i18n="scrapeBtn">${escapeHtml(t("scrapeBtn"))}</span>`;
        lucide.createIcons();
      }
    }

    function askPresetKey(key) {
      askPreset(t(key));
    }

    function askPreset(text) {
      document.getElementById("queryInput").value = text;
      handleAsk(new Event("submit"));
    }

    async function handleAsk(e) {
      e.preventDefault();
      hideAlert();
      const query = document.getElementById("queryInput").value.trim();
      if (!query) return;

      const btn = document.getElementById("askBtn");
      const out = document.getElementById("recommendResults");
      btn.disabled = true;
      out.innerHTML = `
        <div class="bg-white rounded-2xl border border-stone-200 p-8 text-center text-stone-500 text-sm">
          ${escapeHtml(t("loadingRecommend"))}
        </div>`;

      try {
        const res = await fetch("/api/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            personality: getPersonalityPayload(),
            use_live_search: document.getElementById("liveQuerySearch").checked,
            language: state.lang,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Recommendation failed");

        state.lastRecData = data;
        renderRecommendations(data);
        loadCachedEvents();
      } catch (err) {
        out.innerHTML = "";
        showAlert(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    }

      const cardsHtml = (data.recommendations || []).map(item => `

            ${item.source_url ? `<a href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener" class="text-xs font-semibold text-teal-700 hover:underline">${escapeHtml(t("viewSource"))}</a>` : ""}

      `).join("");

      const followupsHtml = (data.suggested_followups || []).map(q => `
        <button onclick="askPreset('${escapeAttr(q)}')" class="text-xs bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-1.5 rounded-full transition">

      `).join("");

      out.innerHTML = `
        <div class="bg-teal-900 text-white rounded-2xl p-5 shado
